# .streamlit/secrets.toml
# Copy this file to .streamlit/secrets.toml and fill in your credentials

# Gemini API Key (same as other EXD tools)
GEMINI_API_KEY = "your-gemini-api-key"

# DataForSEO Backlink credentials
# If using a separate account for backlinks, use DATAFORSEO_BACKLINK_LOGIN/PASSWORD
# If using the same account, use DATAFORSEO_LOGIN/PASSWORD — the app checks both
DATAFORSEO_BACKLINK_LOGIN    = "your-dataforseo-backlink-email"
DATAFORSEO_BACKLINK_PASSWORD = "your-dataforseo-backlink-password"

# Optional: fallback to existing SERP credentials if backlink account not yet set up
# DATAFORSEO_LOGIN    = "your-existing-dataforseo-email"
# DATAFORSEO_PASSWORD = "your-existing-dataforseo-password"
